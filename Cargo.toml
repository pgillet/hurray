[workspace]
members = [
    "hurray-core",
    "hurray-io",
    "hurray-ffi",
    "hurray-python",
    "hurray-inspect",
    "conformance",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
# Canonical project URLs — single source of truth for all publishable crates.
# Change these here (not per-crate) if the repo moves or the site's canonical URL changes.
repository = "https://github.com/pgillet/hurray"
homepage = "https://www.pascalgillet.net/hurray/"
authors = ["Hurray Contributors"]

[workspace.dependencies]
# path + version: path is used for local workspace builds; version is what published
# crates depend on (required by crates.io). Kept in lockstep with workspace.package.version.
hurray-core = { path = "hurray-core", version = "0.1.0" }
hurray-io = { path = "hurray-io", version = "0.1.0" }
hurray-ffi = { path = "hurray-ffi", version = "0.1.0" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
half = "2"
rayon = "1"
tokio = { version = "1", features = ["full"] }
bytes = "1"
crc32c = "0.6"
pyo3 = { version = "0.29" }
numpy = "0.29"
