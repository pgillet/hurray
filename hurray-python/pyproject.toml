[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "pyhurray"
version = "0.2.0"
description = "Python bindings for the Hurray tensor interchange format"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
numpy  = ["numpy>=1.24"]
torch  = ["torch>=2.0"]
scipy  = ["scipy>=1.10"]
dev    = ["maturin>=1.7", "pytest>=8.0", "numpy>=1.24"]

[tool.maturin]
# The distribution is `pyhurray` because `hurray` is taken on PyPI; the import
# name stays `hurray`, so maturin needs the module name spelled out here.
module-name = "hurray"
# The package is mixed Rust/Python: `hurray/aio.py` is the asyncio driver, which is
# Python because that is where the event-loop readiness logic belongs (ADR-042 § 1).
# maturin already built a `hurray/` package around the extension with a generated
# `__init__.py`; this checks that file in instead of generating it.
python-source = "python"
# abi3-py310 is declared as a pyo3 feature in Cargo.toml; maturin picks it up
# from there. The extension-module feature is required for cdylib builds.
features = ["extension-module"]
