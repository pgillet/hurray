[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "hurray"
version = "0.1.0"
description = "Python bindings for the Hurray tensor interchange format"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
numpy  = ["numpy>=1.24"]
torch  = ["torch>=2.0"]
scipy  = ["scipy>=1.10"]
dev    = ["maturin>=1.7", "pytest>=8.0", "numpy>=1.24"]

[tool.maturin]
# abi3-py310 is declared as a pyo3 feature in Cargo.toml; maturin picks it up
# from there. The extension-module feature is required for cdylib builds.
features = ["extension-module"]
