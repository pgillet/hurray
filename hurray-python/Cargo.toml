[package]
name = "hurray-python"
description = "Python bindings for hurray with NumPy/PyTorch zero-copy interop via __dlpack__."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Ships to PyPI as `pyhurray`, never to crates.io: a PyO3 extension crate is of no use
# to a Rust dependent. Marked so a workspace-wide publish cannot send it there by default.
publish = false

[features]
# extension-module is off by default so `cargo test` can link libpython.
# Maturin adds it automatically when building the wheel (via pyproject.toml).
# To build the wheel manually: cargo build --features extension-module
default = ["numpy"]
numpy = ["dep:numpy"]
extension-module = ["pyo3/extension-module"]

[dependencies]
hurray-core = { workspace = true }
hurray-ffi = { workspace = true }
hurray-io = { workspace = true }
half = { workspace = true }
pyo3 = { workspace = true, features = ["abi3-py310"] }
numpy = { workspace = true, optional = true }
tokio = { workspace = true }

[lib]
name = "hurray"
# cdylib: the Python extension (.so / .pyd); rlib: lets integration tests link
crate-type = ["cdylib", "rlib"]
# Two libs in this workspace are named `hurray` — this one, because that is the Python
# module name, and the umbrella crate that holds the name on crates.io. rustdoc writes
# both to the same path, so a workspace-wide `cargo doc` fails on the collision. This is
# the one to drop: its user-facing reference is the pdoc Python API, and the crate is
# `publish = false`, so no docs.rs page is lost either.
doc = false

[lints.rust]
# PyO3 0.22 create_exception! macro emits cfg(feature = "gil-refs") into the
# destination crate's scope. Declare it as a known value to suppress the
# unexpected_cfgs warning that -D warnings would otherwise promote to an error.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("gil-refs"))'] }
