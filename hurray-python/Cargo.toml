[package]
name = "hurray-python"
description = "Python bindings for hurray with NumPy/PyTorch zero-copy interop via __dlpack__."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# extension-module is off by default so `cargo test` can link libpython.
# Maturin adds it automatically when building the wheel (via pyproject.toml).
# To build the wheel manually: cargo build --features extension-module
default = ["numpy"]
numpy = ["dep:numpy"]
extension-module = ["pyo3/extension-module"]

[dependencies]
hurray-core = { workspace = true }
hurray-io = { workspace = true }
half = { workspace = true }
pyo3 = { workspace = true, features = ["abi3-py310"] }
numpy = { workspace = true, optional = true }
tokio = { workspace = true }

[lib]
name = "hurray"
# cdylib: the Python extension (.so / .pyd); rlib: lets integration tests link
crate-type = ["cdylib", "rlib"]

[lints.rust]
# PyO3 0.22 create_exception! macro emits cfg(feature = "gil-refs") into the
# destination crate's scope. Declare it as a known value to suppress the
# unexpected_cfgs warning that -D warnings would otherwise promote to an error.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("gil-refs"))'] }
