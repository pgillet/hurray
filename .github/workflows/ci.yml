name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo check --workspace --all-features
      # Compile-check benchmarks so they don't bit-rot (they are not run in CI).
      - run: cargo check -p hurray-core -p hurray-io --benches

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # --all-targets lints tests, benches, and examples too. hurray-python is linted
      # separately with default features (its extension-module feature is for .so builds).
      - run: cargo clippy --workspace --exclude hurray-python --all-targets --all-features -- -D warnings
      - run: cargo clippy -p hurray-python --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # numpy is needed so hurray-python's content-display tests (Tensor and
      # SparseTensor repr/str) exercise the real array-rendering path rather than
      # the numpy-absent metadata fallback.
      - run: python -m pip install --upgrade pip numpy
      # extension-module strips -lpython from the linker flags (correct for .so
      # wheels loaded by Python, fatal for test binaries that call into libpython).
      # Run hurray-python tests separately with default features (no extension-module).
      - run: cargo test --workspace --all-features --exclude hurray-python
      - run: cargo test -p hurray-python

  python-conformance:
    name: Python conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Build the hurray extension into a venv and validate the Python binding against
      # the shared golden corpus (conformance/vectors/). maturin develop needs a virtualenv.
      - name: Create venv + install tooling
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip maturin numpy pytest
      - name: Build hurray extension (editable)
        run: .venv/bin/maturin develop -m hurray-python/Cargo.toml
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
      - name: Run Python conformance tests
        run: .venv/bin/python -m pytest hurray-python/tests/test_conformance.py -v
