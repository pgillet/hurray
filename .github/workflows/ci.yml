name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo check --workspace --all-features
      # Compile-check benchmarks so they don't bit-rot (they are not run in CI).
      - run: cargo check -p hurray-core -p hurray-io --benches

  # hurray-python did not compile for Windows for months (issue #215): every other job
  # runs on Linux, so unconditional std::os::fd went unnoticed until the first wheel
  # build. A cross-check catches that class of break; `cargo check` needs no linker, so
  # it costs one target download rather than a Windows runner.
  windows-target:
    name: Windows cross-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p hurray-python --target x86_64-pc-windows-msvc

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # --all-targets lints tests, benches, and examples too. hurray-python is linted
      # separately with default features (its extension-module feature is for .so builds).
      - run: cargo clippy --workspace --exclude hurray-python --all-targets --all-features -- -D warnings
      - run: cargo clippy -p hurray-python --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # numpy is needed so hurray-python's content-display tests (Tensor and
      # SparseTensor repr/str) exercise the real array-rendering path rather than
      # the numpy-absent metadata fallback.
      - run: python -m pip install --upgrade pip numpy
      # extension-module strips -lpython from the linker flags (correct for .so
      # wheels loaded by Python, fatal for test binaries that call into libpython).
      # Run hurray-python tests separately with default features (no extension-module).
      - run: cargo test --workspace --all-features --exclude hurray-python
      - run: cargo test -p hurray-python
      # Examples are documentation people copy, and nothing else imports them, so
      # they rot silently — `--all-targets` compiles them but never runs them.
      # Enumerated from cargo metadata so a new example needs no edit here.
      - name: Run Rust examples
        run: |
          cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] as $p | $p.targets[]
                     | select(.kind[] == "example")
                     | "\($p.name) \(.name)"' \
            | while read -r pkg example; do
                echo "::group::$pkg --example $example"
                cargo run -q -p "$pkg" --example "$example" || exit 1
                echo "::endgroup::"
              done
      # Same argument as the examples above, for the other body of Rust people copy:
      # the cookbook's fenced blocks. rustdoc --test compiles each one and runs it
      # unless the fence says no_run/ignore. Lives here rather than in docs-check.yml
      # because the blocks rot when the *API* moves, and that workflow only fires on
      # changes under docs/ and website/ (#187).
      - name: Compile cookbook Rust blocks
        run: python3 website/check-rust-blocks.py

  python-conformance:
    name: Python conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Build the hurray extension into a venv and validate the Python binding against
      # the shared golden corpus (conformance/vectors/). maturin develop needs a virtualenv.
      - name: Create venv + install tooling
        run: |
          python -m venv .venv
          # scipy: the sparse interop paths (from_scipy / to_scipy) are untestable without it.
          .venv/bin/python -m pip install --upgrade pip maturin numpy scipy pytest
      - name: Build hurray extension (editable)
        run: .venv/bin/maturin develop -m hurray-python/Cargo.toml
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
      # Whole directory, not one file: a new test module must not need a CI edit to run.
      - name: Run Python tests
        run: .venv/bin/python -m pytest hurray-python/tests/ -v
      # The Implementation Status page is regenerated from the crates, the compiled Python
      # module, and the C header, then diffed against the committed copy (#197). It runs
      # in this job because this is the only one with the extension importable — the
      # Python column cannot be probed without it.
      - name: Check the implementation status matrix
        run: .venv/bin/python website/check-coverage-matrix.py

  semver:
    name: SemVer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # cargo-semver-checks compares the public API against the last *published* release,
      # so the gate is whether crates.io has one — not whether a git tag exists. The tag
      # is pushed before the publish, so gating on it meant the 0.1.0 tag switched this
      # job on against a registry that had never heard of the crate, and it failed with
      # "hurray-core not found in registry". Once the crates are published the job wakes
      # up on its own and gates API changes (in 0.x a breaking change requires a minor
      # bump; post-1.0 it must not break).
      - id: baseline
        run: |
          # crates.io rejects requests without a User-Agent, which would look like a
          # missing crate rather than a refused request.
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -A 'hurray-ci (https://github.com/pgillet/hurray)' \
            https://crates.io/api/v1/crates/hurray-core || echo 000)
          if [ "$code" = "200" ]; then
            echo "have=yes" >> "$GITHUB_OUTPUT"
          else
            echo "have=no" >> "$GITHUB_OUTPUT"
            echo "hurray-core is not on crates.io (HTTP $code) — no baseline to compare against; skipping."
          fi
      - if: steps.baseline.outputs.have == 'yes'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - if: steps.baseline.outputs.have == 'yes'
        run: cargo semver-checks check-release -p hurray-core -p hurray-io -p hurray-ffi
