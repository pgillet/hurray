# cargo-deny configuration — dependency advisory, license, ban, and source checks.
# See https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
yanked = "deny"
# Ignored advisories are tracked and time-bound. Remove once fixed.
ignore = [
    # pyo3 <0.24.1 / <0.29 via numpy 0.22 — only affects hurray-python (a PyPI wheel, not
    # published to crates.io). Cleared by the pyo3/numpy upgrade tracked in issue #121.
    "RUSTSEC-2025-0020",
    "RUSTSEC-2026-0177",
]

[licenses]
version = 2
# Permissive licenses acceptable for a MIT OR Apache-2.0 project.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
