<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290" role="img" aria-label="A prefill worker sends key-value cache blocks to a decode worker over RDMA; only block buffers and identifiers cross the wire, while shape, element type, page size, layout, quantization and parallelism degree are assumed identical on both sides.">
  <rect x="0.5" y="0.5" width="879" height="289" fill="#ffffff" stroke="#cbd5e1"/>

  <rect x="24" y="46" width="212" height="118" rx="6" fill="#e6f4f1" stroke="#0f766e"/>
  <text x="130" y="66" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">Prefill worker</text>
  <text x="130" y="81" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="10" text-anchor="middle" fill="#475569">processes the whole prompt</text>
  <text x="130" y="100" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="10" text-anchor="middle" fill="#475569">paged KV cache in device memory</text>
  <rect x="44" y="110" width="26" height="22" rx="3" fill="#ffffff" stroke="#0f766e"/>
  <rect x="76" y="110" width="26" height="22" rx="3" fill="#ffffff" stroke="#0f766e"/>
  <rect x="108" y="110" width="26" height="22" rx="3" fill="#ffffff" stroke="#0f766e"/>
  <rect x="140" y="110" width="26" height="22" rx="3" fill="#ffffff" stroke="#0f766e"/>
  <rect x="172" y="110" width="26" height="22" rx="3" fill="#ffffff" stroke="#0f766e"/>
  <text x="130" y="150" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.5" text-anchor="middle" fill="#475569">fixed-size blocks + block table</text>

  <rect x="330" y="86" width="220" height="40" rx="6" fill="#f1f5f9" stroke="#64748b"/>
  <text x="440" y="104" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#0f172a">RDMA transfer library</text>
  <text x="440" y="118" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="10" text-anchor="middle" fill="#475569">NIXL · UCX · NCCL · vendor engines</text>

  <line x1="242" y1="106" x2="320" y2="106" stroke="#0f172a" stroke-width="1.6"/>
  <polygon points="330,106 318,100 318,112" fill="#0f172a"/>
  <line x1="556" y1="106" x2="634" y2="106" stroke="#0f172a" stroke-width="1.6"/>
  <polygon points="644,106 632,100 632,112" fill="#0f172a"/>
  <text x="440" y="72" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#0f172a">on the wire: block buffers + block identifiers</text>

  <rect x="646" y="46" width="210" height="118" rx="6" fill="#e6f4f1" stroke="#0f766e"/>
  <text x="751" y="66" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">Decode worker</text>
  <text x="751" y="81" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="10" text-anchor="middle" fill="#475569">emits one token at a time</text>
  <text x="751" y="100" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="10" text-anchor="middle" fill="#475569">reads and extends the same cache</text>
  <rect x="666" y="110" width="26" height="22" rx="3" fill="#ffffff" stroke="#0f766e"/>
  <rect x="698" y="110" width="26" height="22" rx="3" fill="#ffffff" stroke="#0f766e"/>
  <rect x="730" y="110" width="26" height="22" rx="3" fill="#ffffff" stroke="#0f766e"/>
  <rect x="762" y="110" width="26" height="22" rx="3" fill="#ffffff" stroke="#0f766e"/>
  <rect x="794" y="110" width="26" height="22" rx="3" fill="#ffffff" stroke="#0f766e"/>
  <text x="751" y="150" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.5" text-anchor="middle" fill="#475569">must already know how to read them</text>

  <path d="M130 164 L130 190 L214 190" fill="none" stroke="#b45309" stroke-width="1.2" stroke-dasharray="4 3"/>
  <path d="M751 164 L751 190 L666 190" fill="none" stroke="#b45309" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="214" y="174" width="452" height="34" rx="6" fill="#fef6e7" stroke="#b45309" stroke-dasharray="4 3"/>
  <text x="440" y="190" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#7c2d12">assumed identical on both sides, fixed at startup:</text>
  <text x="440" y="203" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#7c2d12">shape · element type · page size · layout · quantization · parallelism degree</text>

  <rect x="214" y="226" width="452" height="30" rx="6" fill="#fdecec" stroke="#b91c1c"/>
  <text x="440" y="245" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#7f1d1d">If any of them differs, a hand-written conversion module is required.</text>

  <text x="440" y="276" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#475569">The transport is fast and reusable. The description of what it carries is not sent at all.</text>
</svg>
