<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 306" width="880" height="306" role="img" aria-label="Today a producer sends only buffer bytes and the description is agreed out of band; with a self-describing descriptor the description travels with the bytes.">
  <rect x="0.5" y="0.5" width="879" height="305" fill="#ffffff" stroke="#cbd5e1"/>

  <text x="24" y="26" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Today</text>
  <line x1="24" y1="34" x2="856" y2="34" stroke="#e2e8f0"/>

  <rect x="24" y="50" width="176" height="46" rx="6" fill="#e6f4f1" stroke="#0f766e"/>
  <text x="112" y="70" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0f172a">Producer</text>
  <text x="112" y="86" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="10" text-anchor="middle" fill="#475569">compute framework</text>

  <line x1="206" y1="73" x2="644" y2="73" stroke="#0f172a" stroke-width="1.6"/>
  <polygon points="654,73 642,67 642,79" fill="#0f172a"/>
  <text x="430" y="63" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#0f172a">buffer bytes, plus an identifier</text>

  <rect x="656" y="50" width="176" height="46" rx="6" fill="#e6f4f1" stroke="#0f766e"/>
  <text x="744" y="70" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0f172a">Consumer</text>
  <text x="744" y="86" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="10" text-anchor="middle" fill="#475569">compute framework</text>

  <path d="M112 96 L112 122 L216 122" fill="none" stroke="#b45309" stroke-width="1.2" stroke-dasharray="4 3"/>
  <path d="M744 96 L744 122 L644 122" fill="none" stroke="#b45309" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="216" y="106" width="428" height="34" rx="6" fill="#fef6e7" stroke="#b45309" stroke-dasharray="4 3"/>
  <text x="430" y="122" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#7c2d12">shape · element type · layout · quantization · device placement</text>
  <text x="430" y="135" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#7c2d12">agreed out of band: config files, startup handshake, matching builds</text>

  <text x="24" y="176" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">With a self-describing descriptor</text>
  <line x1="24" y1="184" x2="856" y2="184" stroke="#e2e8f0"/>

  <rect x="24" y="222" width="176" height="46" rx="6" fill="#e6f4f1" stroke="#0f766e"/>
  <text x="112" y="242" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0f172a">Producer</text>
  <text x="112" y="258" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="10" text-anchor="middle" fill="#475569">compute framework</text>

  <line x1="206" y1="245" x2="644" y2="245" stroke="#0f172a" stroke-width="1.6"/>
  <polygon points="654,245 642,239 642,251" fill="#0f172a"/>
  <rect x="222" y="200" width="416" height="30" rx="6" fill="#e6f4f1" stroke="#0f766e"/>
  <text x="430" y="219" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#134e4a">descriptor: shape · element type · layout · quantization · device</text>
  <text x="430" y="262" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#0f172a">buffer bytes</text>

  <rect x="656" y="222" width="176" height="46" rx="6" fill="#e6f4f1" stroke="#0f766e"/>
  <text x="744" y="242" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0f172a">Consumer</text>
  <text x="744" y="258" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="10" text-anchor="middle" fill="#475569">compute framework</text>

  <text x="430" y="292" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#475569">Nothing is assumed. The consumer reads the descriptor and knows what conversion, if any, it must perform.</text>
</svg>
