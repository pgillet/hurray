<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 338" width="880" height="338" role="img" aria-label="A two by two grid. Rows are whether the two sides agree on the representation; columns are whether the consumer can reach the buffers. Agreeing and reachable means use in place; agreeing but unreachable means move the bytes unchanged; differing but reachable means convert in place; differing and unreachable means move and convert.">
  <rect x="0.5" y="0.5" width="879" height="337" fill="#ffffff" stroke="#cbd5e1"/>

  <text x="24" y="30" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="11" fill="#475569">Two independent questions. Neither answer implies the other.</text>

  <rect x="216" y="52" width="316" height="34" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="374" y="73" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0f172a">Consumer can reach the buffers</text>

  <rect x="540" y="52" width="316" height="34" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="698" y="73" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0f172a">Consumer cannot reach them</text>

  <rect x="24" y="94" width="184" height="84" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="116" y="130" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0f172a">Representations</text>
  <text x="116" y="146" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0f172a">agree</text>

  <rect x="24" y="186" width="184" height="84" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="116" y="222" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0f172a">Representations</text>
  <text x="116" y="238" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0f172a">differ</text>

  <rect x="216" y="94" width="316" height="84" rx="4" fill="#e6f4f1" stroke="#0f766e"/>
  <text x="374" y="126" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#134e4a">Use in place</text>
  <text x="374" y="146" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#334155">Nothing is copied and nothing is</text>
  <text x="374" y="160" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#334155">converted.</text>

  <rect x="540" y="94" width="316" height="84" rx="4" fill="#e6f4f1" stroke="#0f766e"/>
  <text x="698" y="126" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#134e4a">Move the bytes</text>
  <text x="698" y="146" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#334155">The representation does not change.</text>
  <text x="698" y="160" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#334155">A transport does the work.</text>

  <rect x="216" y="186" width="316" height="84" rx="4" fill="#e6f4f1" stroke="#0f766e"/>
  <text x="374" y="218" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#134e4a">Convert in place</text>
  <text x="374" y="238" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#334155">Access alone is not enough. No</text>
  <text x="374" y="252" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#334155">transport is needed.</text>

  <rect x="540" y="186" width="316" height="84" rx="4" fill="#e6f4f1" stroke="#0f766e"/>
  <text x="698" y="218" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#134e4a">Move and convert</text>
  <text x="698" y="238" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#334155">The descriptor says which</text>
  <text x="698" y="252" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#334155">conversion is required.</text>

  <text x="24" y="300" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="10.5" fill="#475569">A tensor descriptor determines which row you are in: it states the representation, so the two sides can compare.</text>
  <text x="24" y="318" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="10.5" fill="#475569">Allocators and transports determine which column: CUDA IPC, shared memory, RDMA registration, NIXL, UCX, NCCL.</text>
</svg>
