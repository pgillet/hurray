[package]
name = "hurray-ffi"
description = "C ABI layer for hurray language bindings — opaque handles, function table, buffer release callbacks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/hurray-ffi"
readme = "README.md"
keywords = ["tensor", "ffi", "c-api", "bindings", "abi"]
categories = ["external-ffi-bindings", "encoding"]

[dependencies]
hurray-core = { workspace = true }
# default-features = false drops tokio: ADR-041 § 8's whole point is that a C consumer
# links no async runtime. hurray-io's sans-io core is not feature-gated.
hurray-io = { workspace = true, default-features = false }
bytes = { workspace = true }

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[build-dependencies]
cbindgen = "0.27"
