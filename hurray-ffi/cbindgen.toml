language = "C"
include_guard = "HURRAY_H"
autogen_warning = "/* Warning, this file is autogenerated by cbindgen. Don't modify this manually. */"
tab_width = 4
documentation = true
documentation_style = "c99"
header = "/* Hurray C ABI — https://github.com/pgillet/hurray */"

[export]
include = ["HurrayStatus", "HurrayReleaseCallback", "HurrayEventReleaseFn", "HurraySyncEventPayload", "HurraySyncConsumerStreamPayload", "HurrayBuffer", "HurrayDescriptor", "HurrayReader", "HurrayWriter"]
exclude = []

[export.rename]
"HurrayStatus" = "HurrayStatus"

[fn]
prefix = ""
postfix = ""
sort_by = "Name"
args = "Auto"

[defines]

[parse]
parse_deps = false
