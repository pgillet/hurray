[package]
name = "hurray-io"
description = "Async streaming and file format read/write for the hurray tensor interchange format."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://www.pascalgillet.net/hurray/"
documentation = "https://docs.rs/hurray-io"
readme = "README.md"
keywords = ["tensor", "serialization", "streaming", "mmap", "async"]
categories = ["encoding", "asynchronous", "filesystem"]

[dependencies]
hurray-core = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
bytes = { workspace = true }
crc32c = { workspace = true }

[features]
default = ["tokio"]
tokio = ["dep:tokio"]

[[example]]
name = "stream_roundtrip"
required-features = ["tokio"]

[[example]]
name = "composite_stream"
required-features = ["tokio"]

[[example]]
name = "composite_file"
required-features = ["tokio"]

[dev-dependencies]
criterion = { version = "0.8.2", features = ["async_tokio"] }
tokio = { workspace = true }

[[bench]]
name = "io"
harness = false
required-features = ["tokio"]
