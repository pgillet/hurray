[package]
name = "hurray-inspect"
description = "CLI tool to inspect Hurray binary tensor descriptor files as a human-readable hex table."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/hurray-inspect"
readme = "README.md"
keywords = ["tensor", "hexdump", "cli", "inspect", "debugging"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "hurray-inspect"
path = "src/main.rs"

[dependencies]
hurray-core = { workspace = true }
thiserror = { workspace = true }
half = { workspace = true }

[dev-dependencies]
# Tests only, and only for the container writer: this crate parses `HRRYFILE` with its own
# self-contained reader, and hand-rolling a valid header/index/CRC/trailer in a test would
# be asserting against a second parser rather than against the format.
hurray-io = { workspace = true }
