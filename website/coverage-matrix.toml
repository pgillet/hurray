# ── Notes ────────────────────────────────────────────────────────────────────────────

[notes]

transport = """
No crate implements any part of the Level 3 transport: none of the message types,
capability flags, or the RDMA data plane appear anywhere in `hurray-core`, `hurray-io`,
`hurray-ffi`, `hurray-python`, or `hurray-inspect`. `hurray-io` implements the stream
framing and the file container — Levels 1 and 2 — and stops there. The protocol is
specified so that an implementation has something to build against; scheduling one is
tracked separately.
"""

ffi-level-1 = """
`hurray_descriptor_decode` parses and validates a descriptor through `hurray-core`, so the
reading itself is complete, but the C surface exposes only the type tag, layout tag, rank,
shape, byte offset, and buffer table. Layout-specific payload fields — CSR `nnz`, tile
shape, the block table — have no accessor, so a C caller cannot yet interpret every Tier 1
layout it can decode.
"""

ffi-tag-passthrough = """
The C ABI reports the raw tag byte (`hurray_descriptor_element_type_tag`,
`hurray_descriptor_layout_tag`) and never interprets it. There is no per-tag support to
report at this layer: a C caller decides for itself which tags it can handle, and gains a
new one without any change to `hurray-ffi`.
"""
