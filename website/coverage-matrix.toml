# Canonical spec-feature list behind the Implementation Status page (issue #197).
#
# `website/check-coverage-matrix.py` reads this file, probes each implementation, and
# regenerates `docs/impl/implementation-status.md`. Rows are spec features, taken from
# `docs/impl/compliance.md`; columns are implementations. Nothing here states that a
# feature *is* supported — a cell says how to go and find out.
#
# ── Cell grammar ─────────────────────────────────────────────────────────────────────
#
# A cell is resolved from the row's `<impl>` key, else the section's `detect.<impl>`, else
# the column's own `default`. That last fallback is what makes a third-party column one
# `[[implementations]]` block — `default = "no"`, refined row by row as it grows — rather
# than an edit to every section. The value is either a detection recipe:
#
#   element-type    the row's `tag` is one the implementation's decoder accepts
#   layout-tag      the row's `tag` is a named layout the implementation knows
#   quant-scheme    the row's `tag` resolves to a quantization scheme
#   capability      the row's `capability` round-trip passed in the Rust probe
#   python-class    every name in the row's `python_class` is a class in `hurray`
#   python-attr     every dotted path in the row's `python_attrs` exists in `hurray`
#   c-symbol        every name in the row's `c_symbols` is exported by `hurray.h`
#
# … or a declaration, `<status>` or `<status>:<note>`, where `<note>` keys into [notes]:
#
#   no          not implemented — the only status that needs no justification, because
#               it is the only one that cannot overstate what an implementation does
#   yes         supported, but not mechanically detectable; the note must say why not
#   partial     partly supported; the note must say which part
#   n/a         the feature is not this layer's to implement; the note must say why
#   spec-only   specified and implemented nowhere; the note must point at the spec
#
# A `c_symbols` entry may name a symbol that does not exist yet, provided it follows the
# existing `hurray_<object>_<property>` convention: the cell then flips to supported by
# itself on the day that symbol is exported, which a hand-written "no" never would.

# ── Columns ──────────────────────────────────────────────────────────────────────────

[[implementations]]
id = "rust"
label = "`hurray-core` + `hurray-io`"
summary = "Rust reference implementation"
probe = "rust"

[[implementations]]
id = "python"
label = "`hurray-python`"
summary = "Python bindings (PyO3)"
probe = "python"

[[implementations]]
id = "ffi"
label = "`hurray-ffi`"
summary = "C ABI surface"
probe = "c-header"

# ── Conformance levels ───────────────────────────────────────────────────────────────

[[sections]]
id = "conformance-levels"
title = "Conformance Levels"
intro = """
The three levels defined in [Compliance](compliance.md). Level 2 implies Level 1, and
Level 3 implies Level 2.
"""
columns = []
detect.rust = "capability"
detect.python = "python-attr"
detect.ffi = "c-symbol"
rows = [
  { id = "level-1", name = "Level 1 — Reader", capability = "descriptor_decode", python_attrs = ["Descriptor.decode"], ffi = "partial:ffi-level-1" },
  { id = "level-2", name = "Level 2 — Writer", capability = "descriptor_encode", python_attrs = ["Descriptor.encode"], c_symbols = ["hurray_descriptor_encode"] },
  { id = "level-3", name = "Level 3 — Network transport", rust = "spec-only:transport", python = "spec-only:transport", ffi = "spec-only:transport" },
]

